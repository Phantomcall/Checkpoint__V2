# Keep the free-tier Render services from sleeping while judges are looking.
# GitHub only runs this after it is on main. Outside the window the job exits
# without calling either service.
name: wake

on:
  schedule:
    # Every 5 minutes. Render's free tier sleeps after about 15 minutes idle,
    # and a cold start can take a minute, so the curl timeout is 90s.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Guard and the agents during judging
        run: |
          now=$(date -u +%Y%m%d%H%M)
          # 15 Nov 2026 18:00 UTC through 19 Nov 2026 00:00 UTC.
          if [ "$now" -lt 202611151800 ] || [ "$now" -ge 202611190000 ]; then
            echo "outside the judging window; nothing to do"
            exit 0
          fi
          curl -fsS --retry 2 --retry-all-errors --max-time 90 https://checkpoint-guard.onrender.com/v1/health
          echo
          curl -fsS --retry 2 --retry-all-errors --max-time 90 https://checkpoint-agents.onrender.com/v1/health
          echo
