[package]
name = "checkpoint-sandbox-tests"
version = "0.1.0"
description = "near-workspaces tests for the Vault and cpUSD in a local sandbox (needs the wasm files from `pnpm contracts:build`)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
near-workspaces = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
# The payload is re-declared here with plain borsh, so these tests also check
# the Vault against an independent encoder.
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = "2"
